<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lane View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/x-icon" href="images/bowling_pin.ico">
</head>
<body class="lane-body">
  <header class="top-bar">
    <h1 id="lane-title">Lane</h1>
    <nav class="top-nav">
      <a href="index.html">Front Desk</a>
      <a href="bowlers.html">Bowlers</a>
      <a href="leagues.html">Leagues</a>
      <a href="teams.html">Teams</a>
      <button id="lane-menu-btn" class="btn-secondary small">Menu</button>
    </nav>
  </header>

  <main class="lane-main">
    <section class="panel lane-info-panel">
      <div id="lane-info"></div>
      <div class="game-switcher">
        <button id="game1-btn" class="btn-small btn-game">Game 1</button>
        <button id="game2-btn" class="btn-small btn-game">Game 2</button>
        <button id="game3-btn" class="btn-small btn-game">Game 3</button>
      </div>
      <button id="view-toggle" class="btn-small">Show Last 4 Frames</button>
    </section>

    <section class="panel lane-controls-panel">
      <div class="lane-controls-header">
        <h2></h2>
      </div>

      <div id="next-game-banner" class="next-game-banner hidden">
        Bowl to start next game
      </div>

      <div id="bowling-popup" class="bowling-popup hidden">
        <div id="bowling-popup-label" class="bowling-popup-label"></div>
        <img id="bowling-popup-img" src="" alt="Bowling event" />
      </div>

      
      <div id="scoreboard" class="scoreboard"></div>
    </section>

    <section class="panel lane-pin-panel">
      <div id="pin-buttons" class="pins-buttons"></div>
    </section>

    <section id="series-recap" class="panel lane-recap-panel">
      <!-- filled by JS -->
    </section>
  </main>

  <!-- Lane menu modal -->
  <div id="lane-menu-overlay" class="modal-overlay hidden">
    <div class="modal-window">
      <div class="modal-header">
        <h3>Lane Menu</h3>
        <button id="menu-close-btn" class="btn-small btn-secondary">X</button>
      </div>

      <div class="modal-body">

        <!-- OPEN BOWLING ONLY (auto-hidden by JS when league/team assigned) -->
        <button id="menu-add-bowler-btn" class="btn-primary modal-action">
          ➕ Add Bowler (Open Bowling)
        </button>

        <button id="menu-remove-bowler-btn" class="btn-secondary modal-action">
          ➖ Remove Bowler (Open Bowling)
        </button>

        <hr />

        <!-- Normal game actions -->
        <button id="menu-absent-btn" class="btn-primary modal-action">
          Toggle Current Bowler Absent
        </button>

        <button id="menu-skip-btn" class="btn-secondary modal-action">
          Next / Skip Bowler
        </button>

        <button id="menu-correct-btn" class="btn-secondary modal-action">
          Score Correction
        </button>

        <button id="menu-settings-btn" class="btn-secondary modal-action">
          Lane Colors / Settings
        </button>

      </div>

      <div class="modal-footer">
        <button id="menu-close-bottom-btn" class="btn-small btn-secondary">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-overlay" class="modal-overlay hidden">
    <div class="modal-window">
      <div class="modal-header">
        <h3>Lane Colors</h3>
        <button id="settings-close-btn" class="btn-small btn-secondary">X</button>
      </div>

      <div class="modal-body">
        <div class="settings-grid">
          <label for="theme-accent">Accent (totals / highlight)</label>
          <input type="color" id="theme-accent" />

          <label for="theme-row-odd">Row color (odd)</label>
          <input type="color" id="theme-row-odd" />

          <label for="theme-row-even">Row color (even)</label>
          <input type="color" id="theme-row-even" />

          <label for="theme-border">Scorebox border</label>
          <input type="color" id="theme-border" />

          <label for="theme-highlight">Highlight / Active Bowler</label>
          <input type="color" id="theme-highlight" />
        </div>
      </div>

      <div class="modal-footer">
        <button id="settings-save-btn" class="btn-primary btn-small">
          Save
        </button>
        <button id="settings-close-bottom-btn" class="btn-small btn-secondary">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Game complete modal -->
  <div id="game-complete-overlay" class="modal-overlay hidden">
    <div class="modal-window">
      <div class="modal-header">
        <h3 id="game-complete-title">Game Complete</h3>
        <button id="game-complete-close" class="btn-small btn-secondary">X</button>
      </div>

      <div class="modal-body">
        <div id="game-complete-summary"></div>
      </div>

      <div class="modal-footer">
        <button id="game-complete-next-btn" class="btn-primary btn-small">
          Start Next Game
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="js/lane.js"></script>
</body>
</html>
