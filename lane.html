<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lane</title>
  <link rel="stylesheet" href="css/styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="lane-body">
  <header class="top-bar">
    <h1 id="lane-title">Lane</h1>
    <nav class="top-nav">
      <a href="index.html">Front Desk</a>
      <a href="bowlers.html">Bowlers</a>
      <a href="teams.html">Teams</a>
      <!-- New menu button, right side -->
      <button id="lane-menu-btn" class="btn-secondary small lane-menu-btn">
        Menu ▾
      </button>
    </nav>
  </header>

  <main class="lane-main">
    <section id="lane-info" class="panel lane-info-panel"></section>

    <section class="panel lane-controls-panel">
      <div class="lane-controls-header">
        <h2>Scoring</h2>
        <button id="view-toggle" class="btn-secondary small">
          Show Last 4 Frames
        </button>
      </div>

      <div class="scoreboard" id="scoreboard">
        <!-- Filled by JS -->
      </div>

      <div class="lane-total-row">
        <span class="lane-total-label">Game Total:</span>
        <span id="total-score" class="lane-total-value">0</span>
      </div>
    </section>

    <section class="panel lane-pin-panel">
      <h2>Enter Roll</h2>
      <div id="pin-buttons" class="pins-buttons"></div>
    </section>
  </main>

  <!-- Lane menu modal -->
  <div id="lane-menu-overlay" class="modal-overlay hidden">
    <div class="modal-window">
      <div class="modal-header">
        <h2>Lane Menu</h2>
        <button id="menu-close-btn" class="btn-secondary small">✕</button>
      </div>
      <div class="modal-body">
        <button id="menu-absent-btn" class="btn-primary modal-action">
          Mark Bowler Absent
        </button>
        <button id="menu-correct-btn" class="btn-secondary modal-action">
          Score Correction
        </button>
        <button id="menu-skip-btn" class="btn-secondary modal-action">
          Skip Bowler / Next Bowler
        </button>
      </div>
      <div class="modal-footer">
        <button id="menu-close-bottom-btn" class="btn-secondary small">
          Close
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="js/lane.js"></script>
</body>
</html>
