<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lane</title>
  <link rel="stylesheet" href="css/styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="lane-body">
  <header class="top-bar">
    <h1 id="lane-title">Lane</h1>
    <nav>
      <a href="index.html">Front Desk</a>
      <a href="bowlers.html">Bowlers</a>
      <a href="teams.html">Teams</a>
    </nav>
  </header>

  <main class="lane-main">
    <section id="lane-info" class="panel lane-info-panel"></section>

    <section class="panel lane-controls-panel">
      <div class="lane-controls-header">
        <h2>Scoring</h2>
        <button id="view-toggle" class="btn-secondary small">
          Show Last 4 Frames
        </button>
      </div>

      <div class="scoreboard" id="scoreboard">
        <!-- Filled by JS -->
      </div>

      <div class="lane-total-row">
        <span class="lane-total-label">Game Total:</span>
        <span id="total-score" class="lane-total-value">0</span>
      </div>
    </section>

    <section class="panel lane-pin-panel">
      <h2>Enter Roll</h2>
      <div id="pin-buttons" class="pins-buttons"></div>
    </section>
  </main>

  <script type="module" src="js/lane.js"></script>
</body>
</html>
